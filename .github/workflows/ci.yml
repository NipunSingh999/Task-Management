name: TaskFlow CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test_db
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: taskflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run system checks
      run: |
        python manage.py check

    - name: Verify OpenAPI schema generation
      run: |
        python manage.py spectacular --validate

    - name: Run test suite (with PostgreSQL)
      env:
        DATABASE_URL: postgresql://taskflow_user:taskflow_password@localhost:5432/taskflow_test_db
        SECRET_KEY: ci-test-secret-key-1234567890
        DEBUG: "False"
      run: |
        python manage.py test --verbosity=2
